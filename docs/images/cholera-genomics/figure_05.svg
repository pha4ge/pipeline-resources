<circle cx='867.6' cy='512.4' r='37.6' fill='#F8EAF2' stroke='#CC79A7' stroke-width='14'/>
<text x='682' y='442' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='34' font-weight='700' fill='#1A1A1A'>Chr 1</text>
<text x='682' y='480' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#007A5A'>~2.96 Mb</text>
<text x='867.5945945945946' y='416.81081081081084' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Chr 2</text>
<text x='867.5945945945946' y='448.81081081081084' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#9A4573'>~1.07 Mb</text>
<text x='570' y='600' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>Drawn to relative scale</text>
<text x='570' y='632' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>(Heidelberg et al., 2000)</text>
<rect x='570' y='642' width='370' height='190' rx='22' fill='#E6F5EF' stroke='#009E73' stroke-width='3'/>
<text x='592' y='688' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#007A5A'>Chromosome 1</text>
<text x='592' y='730' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Most genes essential for</text>
<text x='592' y='761' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>cell function and</text>
<text x='592' y='792' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>pathogenicity</text>
<rect x='570' y='854' width='370' height='190' rx='22' fill='#F8EAF2' stroke='#CC79A7' stroke-width='3'/>
<text x='592' y='900' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#9A4573'>Chromosome 2</text>
<text x='592' y='942' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Accessory genes, including</text>
<text x='592' y='973' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>metabolic and</text>
<text x='592' y='1004' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>environmental functions</text>
<rect x='570' y='1066' width='370' height='160' rx='22' fill='#FFF6E3' stroke='#E69F00' stroke-width='3' stroke-dasharray='10 7'/>
<text x='592' y='1110' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Relevant to sequencing</text>
<text x='592' y='1142' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>and assembly</text>
<text x='592' y='1194' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>See Section 5.1</text>

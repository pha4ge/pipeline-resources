<text x='1128' y='308' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1A1A1A'>Environmental strain</text>
<text x='1128' y='346' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Non-toxigenic: lacks CTX&#966;</text>
<text x='1128' y='377' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Common in aquatic environments</text>
<path d='M1050,402 V429' stroke='#4D4D4D' stroke-width='3' marker-end='url(#ar)'/>
<rect x='970' y='432' width='580' height='172' rx='22' fill='#FBEDE4' stroke='#D55E00' stroke-width='3'/>
<rect x='994' y='454' width='102' height='40' rx='20.0' fill='#D55E00'/>
<text x='1045' y='483' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#fff'>STEP 1</text>
<path d='M1020,576 h60' stroke='#D55E00' stroke-width='10' stroke-linecap='round'/><line x1='1030' y1='568' x2='1030' y2='540' stroke='#D55E00' stroke-width='4' stroke-linecap='round'/><circle cx='1030' cy='537' r='5' fill='#D55E00'/><line x1='1043' y1='568' x2='1043' y2='540' stroke='#D55E00' stroke-width='4' stroke-linecap='round'/><circle cx='1043' cy='537' r='5' fill='#D55E00'/><line x1='1057' y1='568' x2='1057' y2='540' stroke='#D55E00' stroke-width='4' stroke-linecap='round'/><circle cx='1057' cy='537' r='5' fill='#D55E00'/><line x1='1070' y1='568' x2='1070' y2='540' stroke='#D55E00' stroke-width='4' stroke-linecap='round'/><circle cx='1070' cy='537' r='5' fill='#D55E00'/>
<text x='1128' y='482' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='32' font-weight='700' fill='#1A1A1A'>Acquires VPI-1</text>
<text x='1128' y='522' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'><tspan font-style='italic'>Vibrio</tspan> Pathogenicity Island 1</text>
<text x='1128' y='553' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>encodes the toxin co-regulated</text>
<text x='1128' y='584' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>pilus (TCP)</text>
<path d='M1050,606 V712' stroke='#E69F00' stroke-width='5' marker-end='url(#ao)'/>
<rect x='1120' y='620' width='430' height='84' rx='20' fill='#E69F00'/>
<text x='1140' y='656' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Order matters: VPI-1 first,</text>
<text x='1140' y='688' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>TCP is the receptor for CTX&#966;</text>
<rect x='970' y='716' width='580' height='244' rx='22' fill='#FBEDE4' stroke='#D55E00' stroke-width='3'/>
<rect x='994' y='738' width='102' height='40' rx='20.0' fill='#D55E00'/>
<text x='1045' y='767' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#fff'>STEP 2</text>
<path d='M1016,844 c8,-34 16,-34 24,0 s16,34 24,0 s16,-34 24,0' fill='none' stroke='#E69F00' stroke-width='9' stroke-linecap='round'/>
<text x='1128' y='766' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='32' font-weight='700' fill='#1A1A1A'>Acquires CTX&#966;</text>
<text x='1128' y='806' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Temperate filamentous phage;</text>
<text x='1128' y='837' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>uses TCP as its receptor;</text>
<text x='1128' y='868' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>integrates as a prophage</text>
<text x='1128' y='902' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Carries <tspan font-style='italic'>ctxA</tspan> and <tspan font-style='italic'>ctxB</tspan>,</text>
<text x='1128' y='933' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>which encode cholera toxin</text>
<path d='M1050,962 V989' stroke='#4D4D4D' stroke-width='3' marker-end='url(#ar)'/>
<rect x='970' y='992' width='580' height='234' rx='22' fill='#FBEDE4' stroke='#D55E00' stroke-width='3'/>

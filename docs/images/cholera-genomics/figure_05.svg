<text x='385.0' y='783' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='32' font-weight='700' fill='#009E73'>O139</text>
<text x='295.0' y='834' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#fff'>cause almost all epidemic</text>
<text x='295.0' y='866' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#fff'>and pandemic cholera</text>

<text x='1128' y='1042' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1A1A1A'>Toxigenic epidemic</text>
<text x='1128' y='1076' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1A1A1A'>strain</text>
<rect x='984' y='1098' width='552' height='108' rx='16' fill='#E69F00'/>
<polygon points='1008.0,1112.0 1011.4,1120.3 1020.4,1121.0 1013.6,1126.8 1015.6,1135.5 1008.0,1130.8 1000.4,1135.5 1002.4,1126.8 995.6,1121.0 1004.6,1120.3' fill='#1A1A1A'/>

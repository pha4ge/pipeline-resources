<text x='1463' y='1115.6' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='25' fill='#1A1A1A'><tspan>keep an access-controlled register linking</tspan></text>
<text x='1463' y='1146.1' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='25' fill='#1A1A1A'><tspan>internal ID, pseudonym and accession</tspan></text>
<text x='1463' y='1176.6' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='25' fill='#1A1A1A'><tspan>(guidance Section 8.3).</tspan></text>

<svg xmlns='http://www.w3.org/2000/svg' width='170mm' height='170.21mm' viewBox='0 0 1610 1612'>
<defs><marker id='ar' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#4D4D4D'/></marker>
<marker id='ao' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#E69F00'/></marker>
<filter id='sh' x='-10%' y='-10%' width='130%' height='140%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#000' flood-opacity='0.12'/></filter></defs>
<rect width='1610' height='1612' fill='#FFFFFF'/>
<g transform='translate(5,-93)'>
<circle cx='72' cy='170' r='24' fill='#005A8C'/><text x='72' y='180' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#fff'>1</text>
<text x='106' y='181' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#005A8C'>CLINICAL AND ENVIRONMENTAL SAMPLES SERVE DISTINCT PURPOSES</text>
<line x1='50' y1='198' x2='1550' y2='198' stroke='#4D4D4D' stroke-width='3'/>
<rect x='50' y='214' width='740.0' height='355' rx='22' fill='#EAF4FB' stroke='#0072B2' stroke-width='3' filter='url(#sh)'/>
<rect x='89' y='233' width='24' height='58' rx='12' fill='#fff' stroke='#0072B2' stroke-width='5'/><rect x='89' y='265' width='24' height='26' rx='12' fill='#0072B2'/><rect x='83' y='229' width='36' height='8' rx='3' fill='#0072B2'/>
<text x='151' y='255' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#005A8C'>Clinical samples (4.1.1)</text>
<text x='151' y='291' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>Isolates from people with possible cholera</text>
<rect x='67' y='312' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='327' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Liquid stool during acute illness; rectal swab if stool</text>
<text x='95' y='358' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>cannot be obtained</text>
<rect x='67' y='377' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='392' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Collect within 4 days of onset and before antibiotics,</text>
<text x='95' y='423' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>which rapidly reduce viable bacteria</text>
<rect x='67' y='442' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='457' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Cause often unknown at collection (e.g. <tspan font-style='italic'>Shigella</tspan>,</text>
<text x='95' y='488' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>enterotoxigenic <tspan font-style='italic'>E. coli</tspan>): allow for differential diagnosis</text>
<rect x='67' y='507' width='14' height='14' rx='3' fill='#E69F00'/>
<text x='95' y='522' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Transport: follow GTFCC and CDC guidance</text>
<rect x='810.0' y='214' width='740.0' height='355' rx='22' fill='#E6F5EF' stroke='#009E73' stroke-width='3' filter='url(#sh)'/>
<path d='M861.0,235 C869.0,251 883.0,261 883.0,273 A22,22 0 0 1 839.0,273 C839.0,261 853.0,251 861.0,235 z' fill='#0072B2'/>
<text x='911.0' y='255' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#007A5A'>Environmental samples (4.1.2)</text>
<text x='911.0' y='291' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>Water, wastewater and sediment</text>
<rect x='827.0' y='312' width='14' height='14' rx='3' fill='#009E73'/>
<text x='855.0' y='327' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Investigate potential transmission sources</text>
<rect x='827.0' y='346' width='14' height='14' rx='3' fill='#009E73'/>
<text x='855.0' y='361' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Monitor high-risk sites, such as water bodies in endemic</text>
<text x='855.0' y='392' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>areas</text>
<rect x='827.0' y='411' width='14' height='14' rx='3' fill='#009E73'/>
<text x='855.0' y='426' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Support outbreak investigation</text>
<rect x='827.0' y='443' width='706.0' height='109' rx='14' fill='#FDEBD8' stroke='#E69F00' stroke-width='3'/>
<text x='841.0' y='473' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Technically challenging: viable but non-culturable state,</text>
<text x='841.0' y='504' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>very low concentrations, ubiquitous non-toxigenic</text>
<text x='841.0' y='535' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>strains. Isolation for WGS is often not achievable.</text>
<circle cx='72' cy='595' r='24' fill='#E69F00'/><text x='72' y='605' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#fff'>2</text>
<text x='106' y='606' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#8A5A00'>FROM EPIDEMIOLOGICAL QUESTION TO A STRATEGY DEFINED IN ADVANCE</text>
<line x1='50' y1='623' x2='1550' y2='623' stroke='#4D4D4D' stroke-width='3'/>
<rect x='50' y='639' width='1500' height='295' rx='22' fill='#EAF4FB' stroke='#0072B2' stroke-width='3' filter='url(#sh)'/>
<circle cx='97' cy='686' r='25' fill='#E69F00'/><text x='97' y='699' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='36' font-weight='700' fill='#fff'>?</text>
<text x='145' y='682' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>The epidemiological question decides which isolates are sequenced, and how many</text>
<path d='M97,722 V750' stroke='#E69F00' stroke-width='5' marker-end='url(#ar)'/>
<text x='67' y='776' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1A1A1A'>Sampling strategy, defined in advance, specifying:</text>
<rect x='67.0' y='796' width='357.5' height='121' rx='16' fill='#fff' stroke='#0072B2' stroke-width='3'/>
<rect x='81.0' y='832.5' width='52' height='52' rx='7' fill='#fff' stroke='#0072B2' stroke-width='5'/><rect x='81.0' y='832.5' width='52' height='16' rx='6' fill='#0072B2'/><rect x='91.0' y='854.5' width='8' height='8' rx='2' fill='#0072B2'/><rect x='104.0' y='854.5' width='8' height='8' rx='2' fill='#0072B2'/><rect x='117.0' y='854.5' width='8' height='8' rx='2' fill='#0072B2'/><rect x='91.0' y='866.5' width='8' height='8' rx='2' fill='#0072B2'/><rect x='104.0' y='866.5' width='8' height='8' rx='2' fill='#0072B2'/><rect x='117.0' y='866.5' width='8' height='8' rx='2' fill='#0072B2'/>
<text x='149.0' y='863.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Time period</text>
<rect x='436.5' y='796' width='357.5' height='121' rx='16' fill='#fff' stroke='#0072B2' stroke-width='3'/>
<rect x='450.5' y='830.5' width='52' height='52' rx='6' fill='#fff' stroke='#0072B2' stroke-width='5'/><path d='M476.5,830.5 V882.5 M450.5,856.5 H502.5' stroke='#0072B2' stroke-width='3'/><circle cx='463.5' cy='843.5' r='6' fill='#E69F00'/><circle cx='489.5' cy='869.5' r='6' fill='#009E73'/>
<text x='518.5' y='863.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Geographic units</text>
<rect x='806.0' y='796' width='357.5' height='121' rx='16' fill='#fff' stroke='#0072B2' stroke-width='3'/>
<rect x='820.0' y='830.5' width='52' height='52' rx='8' fill='#0072B2'/><path d='M846.0,842.5 V870.5 M832.0,856.5 H860.0' stroke='#fff' stroke-width='9' stroke-linecap='round'/>
<text x='888.0' y='863.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Case or site types</text>
<rect x='1175.5' y='796' width='357.5' height='121' rx='16' fill='#fff' stroke='#0072B2' stroke-width='3'/>
<circle cx='1215.5' cy='856.5' r='26' fill='#fff' stroke='#0072B2' stroke-width='5'/><path d='M1215.5,856.5 L1215.5,830.5 A26,26 0 0 1 1241.5,856.5 z' fill='#0072B2'/>
<text x='1257.5' y='832.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Proportion</text>
<text x='1257.5' y='863.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>sequenced from</text>
<text x='1257.5' y='894.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>each</text>
<circle cx='72' cy='960' r='24' fill='#D55E00'/><text x='72' y='970' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#fff'>3</text>
<text x='106' y='971' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#A84300'>A STRATEGY DEFINED IN ADVANCE PROTECTS AGAINST THE TWO MOST COMMON FAILURE MODES</text>
<line x1='50' y1='988' x2='1550' y2='988' stroke='#4D4D4D' stroke-width='3'/>
<rect x='50' y='1004' width='740.0' height='134' rx='22' fill='#FBEDE4' stroke='#D55E00' stroke-width='3' filter='url(#sh)'/>
<path d='M101,1031 L131,1081 H71 z' fill='#D55E00' stroke='#D55E00' stroke-width='4' stroke-linejoin='round'/><rect x='97.5' y='1047' width='7' height='18' rx='3' fill='#fff'/><circle cx='101' cy='1073' r='4' fill='#fff'/>
<text x='151' y='1045' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#A84300'>Too few isolates</text>
<text x='151' y='1081' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Too few isolates sequenced to resolve the question</text>
<rect x='810.0' y='1004' width='740.0' height='134' rx='22' fill='#FBEDE4' stroke='#D55E00' stroke-width='3' filter='url(#sh)'/>
<path d='M861.0,1031 L891.0,1081 H831.0 z' fill='#D55E00' stroke='#D55E00' stroke-width='4' stroke-linejoin='round'/><rect x='857.5' y='1047' width='7' height='18' rx='3' fill='#fff'/><circle cx='861.0' cy='1073' r='4' fill='#fff'/>
<text x='911.0' y='1045' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#A84300'>A convenience set</text>
<text x='911.0' y='1081' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Over-represents one hospital, one district or one</text>
<text x='911.0' y='1112' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>point in time</text>
<circle cx='72' cy='1164' r='24' fill='#009E73'/><text x='72' y='1174' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#fff'>4</text>
<text x='106' y='1175' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#007A5A'>WHEN SEQUENCING CAPACITY IS LIMITED, STRATIFIED BEATS OPPORTUNISTIC</text>
<line x1='50' y1='1192' x2='1550' y2='1192' stroke='#4D4D4D' stroke-width='3'/>
<rect x='50' y='1208' width='740.0' height='272' rx='22' fill='#E6F5EF' stroke='#009E73' stroke-width='3' filter='url(#sh)'/>
<circle cx='101' cy='1257' r='25' fill='#0072B2'/><path d='M89,1258 L98,1268 L114,1248' stroke='#fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/>
<text x='151' y='1249' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#007A5A'>Smaller, deliberately stratified set</text>
<rect x='67' y='1295' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><rect x='225' y='1295' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><rect x='67' y='1381' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><rect x='225' y='1381' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><circle cx='109.0' cy='1319.96' r='8' fill='#009E73'/><circle cx='172.0' cy='1319.96' r='8' fill='#009E73'/><circle cx='142.0' cy='1351.16' r='8' fill='#009E73'/><circle cx='267.0' cy='1319.96' r='8' fill='#009E73'/><circle cx='330.0' cy='1319.96' r='8' fill='#009E73'/><circle cx='300.0' cy='1351.16' r='8' fill='#009E73'/><circle cx='109.0' cy='1405.96' r='8' fill='#009E73'/><circle cx='172.0' cy='1405.96' r='8' fill='#009E73'/><circle cx='142.0' cy='1437.16' r='8' fill='#009E73'/><circle cx='267.0' cy='1405.96' r='8' fill='#009E73'/><circle cx='330.0' cy='1405.96' r='8' fill='#009E73'/><circle cx='300.0' cy='1437.16' r='8' fill='#009E73'/>
<text x='397' y='1317' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>More informative than a</text>
<text x='397' y='1348' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>larger opportunistic set</text>
<text x='397' y='1383' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Isolates are spread evenly</text>
<text x='397' y='1414' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>across the strata</text>
<rect x='810.0' y='1208' width='740.0' height='272' rx='22' fill='#FBEDE4' stroke='#D55E00' stroke-width='3' filter='url(#sh)'/>
<path d='M861.0,1231 L891.0,1281 H831.0 z' fill='#D55E00' stroke='#D55E00' stroke-width='4' stroke-linejoin='round'/><rect x='857.5' y='1247' width='7' height='18' rx='3' fill='#fff'/><circle cx='861.0' cy='1273' r='4' fill='#fff'/>
<text x='911.0' y='1249' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#A84300'>Larger, opportunistic set</text>
<rect x='827.0' y='1295' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><rect x='985.0' y='1295' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><rect x='827.0' y='1381' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><rect x='985.0' y='1381' width='150' height='78' rx='10' fill='#fff' stroke='#8A8A8A' stroke-width='3' stroke-dasharray='8 5'/><circle cx='845.0' cy='1306.7' r='8' fill='#D55E00'/><circle cx='845.0' cy='1324.64' r='8' fill='#D55E00'/><circle cx='845.0' cy='1342.58' r='8' fill='#D55E00'/><circle cx='845.0' cy='1360.52' r='8' fill='#D55E00'/><circle cx='882.5' cy='1306.7' r='8' fill='#D55E00'/><circle cx='882.5' cy='1324.64' r='8' fill='#D55E00'/><circle cx='882.5' cy='1342.58' r='8' fill='#D55E00'/><circle cx='882.5' cy='1360.52' r='8' fill='#D55E00'/><circle cx='920.0' cy='1306.7' r='8' fill='#D55E00'/><circle cx='920.0' cy='1324.64' r='8' fill='#D55E00'/><circle cx='920.0' cy='1342.58' r='8' fill='#D55E00'/><circle cx='920.0' cy='1360.52' r='8' fill='#D55E00'/><circle cx='957.5' cy='1306.7' r='8' fill='#D55E00'/><circle cx='957.5' cy='1324.64' r='8' fill='#D55E00'/><circle cx='957.5' cy='1342.58' r='8' fill='#D55E00'/><circle cx='957.5' cy='1360.52' r='8' fill='#D55E00'/><circle cx='1060.0' cy='1420.0' r='8' fill='#D55E00'/><circle cx='1030.0' cy='1435.6' r='8' fill='#D55E00'/>
<text x='1157.0' y='1317' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Less informative even</text>
<text x='1157.0' y='1348' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>though it is larger</text>
<text x='1157.0' y='1383' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Isolates cluster in one stratum;</text>
<text x='1157.0' y='1414' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>others are barely covered</text>
<text x='1550' y='1510' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>Illustrative schematic, not real data.</text>
<rect x='50' y='1542' width='1500' height='108' rx='22' fill='#EAF4FB' stroke='#0072B2' stroke-width='3' filter='url(#sh)'/>
<rect x='79' y='1567' width='44' height='58' rx='7' fill='#fff' stroke='#0072B2' stroke-width='5'/><rect x='89' y='1561' width='24' height='12' rx='4' fill='#0072B2'/><path d='M89,1589 h24' stroke='#0072B2' stroke-width='5' stroke-linecap='round'/><path d='M89,1603 h24' stroke='#0072B2' stroke-width='5' stroke-linecap='round'/><path d='M89,1617 h24' stroke='#0072B2' stroke-width='5' stroke-linecap='round'/>
<text x='151' y='1583' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#005A8C'>Record and report the achieved sampling frame</text>
<text x='151' y='1619' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>The frame actually achieved is reported alongside any findings derived from it (see Section 6.2.1.1)</text>
</g>

</svg>
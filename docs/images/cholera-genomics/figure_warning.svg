<text x='225' y='84' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='52' font-weight='700' fill='#C77700' letter-spacing='3'>WARNING</text>
<path d='M225,104 H1464' stroke='#E69F00' stroke-width='3'/>
<circle cx='234' cy='143' r='8' fill='#C77700'/>
<text x='259' y='152' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='400' fill='#3A2A00'>Public genomes downloaded for use as contextual sequences may not have been subject</text>
<text x='259' y='192' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='400' fill='#3A2A00'>to the same — or any — quality standards as those generated within a surveillance</text>
<text x='259' y='232' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='400' fill='#3A2A00'>programme and should be quality-checked before inclusion.</text>
<circle cx='234' cy='289' r='8' fill='#C77700'/>
<text x='259' y='298' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='400' fill='#3A2A00'>Analysts must remember that even good-quality genome data, and particularly assemblies,</text>
<text x='259' y='338' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='400' fill='#3A2A00'>represent estimates of a biological genome, not definitive truth about a genome.</text>
</g>


<text x='911' y='1581' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#A84300'>Out of scope for T/AFR typing</text>
<rect x='827' y='1638' width='14' height='14' rx='3' fill='#D55E00'/>
<text x='855' y='1653' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Built for O1 El Tor 7PET; meaningless for</text>
<text x='855' y='1684' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>non-O1/non-O139</text>

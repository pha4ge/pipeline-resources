<text x='106' y='385' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#005A8C'>5.4.1 MULTILOCUS SEQUENCE TYPING: A RAPID CHECK OF PANDEMIC LINEAGE MEMBERSHIP</text>

<text x='151' y='465' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#005A8C'>Two PubMLST schemes (Jolley 2018)</text>
<rect x='67' y='515' width='158.04859374999998' height='44' rx='22.0' fill='#FDF3DC' stroke='#E69F00' stroke-width='3'/>
<text x='82' y='546' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Scheme 1</text>
<text x='241.04859374999998' y='541' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>7 loci, Octavia 2013 (default scheme)</text>
<rect x='67' y='573' width='158.04859374999998' height='44' rx='22.0' fill='#EAF4FB' stroke='#0072B2' stroke-width='3'/>
<text x='82' y='604' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#1A1A1A'>Scheme 2</text>
<text x='241.04859374999998' y='599' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>5 loci, O1/O139, Kanampalliwar and Singh 2020</text>
<rect x='67' y='638' width='14' height='14' rx='3' fill='#E69F00'/>
<text x='95' y='653' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>ST69, ST40, ST635 quoted here are Octavia-scheme STs</text>
<rect x='67' y='672' width='14' height='14' rx='3' fill='#D55E00'/>
<text x='95' y='687' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>STs not comparable between schemes: report the scheme</text>
<rect x='870' y='424' width='680' height='289' rx='22' fill='#fff' stroke='#0072B2' stroke-width='3' filter='url(#sh)'/>
<circle cx='921' cy='473' r='25' fill='#0072B2'/><path d='M909,474 L918,484 L934,464' stroke='#fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/>
<text x='971' y='465' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#005A8C'>What an ST tells you</text>
<rect x='887' y='522' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='915' y='537' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>ST69 dominates 7PET (ST515 occasionally)</text>
<rect x='887' y='556' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='915' y='571' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Confirms 7PET fast; flags non-7PET isolates</text>
<rect x='887' y='590' width='14' height='14' rx='3' fill='#E69F00'/>
<text x='915' y='605' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Malawi: O7 ST40, O19 ST635 (Chaguza 2024)</text>
<rect x='887' y='624' width='14' height='14' rx='3' fill='#E69F00'/>
<text x='915' y='639' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>40 of 67 isolates ST69; 2 O1 isolates were</text>
<text x='915' y='670' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>pre-7PET ST75-2LV (Foster-Nyarko 2025)</text>
<rect x='50' y='729' width='1500' height='101' rx='22' fill='#fff' stroke='#0072B2' stroke-width='3' filter='url(#sh)'/>
<rect x='67' y='755' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='770' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>In silico: <tspan font-style='italic'>mlst</tspan> tool (Seemann) on an assembled genome; scheme 1 is its default, as in Pathogenwatch</text>
<rect x='67' y='789' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='804' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Also built into VibrioWatch/PathogenWatch and TheiaProk, so usually produced by standard pipelines</text>
<circle cx='72' cy='879' r='24' fill='#007A5A'/><text x='72' y='889' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#fff'>3</text>
<text x='106' y='890' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#007A5A'>5.4.2 LINEAGE CLASSIFICATION: PLACE THE ISOLATE WITHIN THE T/AFR FRAMEWORK</text>

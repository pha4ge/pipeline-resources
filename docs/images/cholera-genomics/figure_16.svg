<text x='95' y='1653' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Tree with contextual references, read manually</text>
<rect x='67' y='1672' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='1687' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Or phylogenetic placement (Vibecheck)</text>

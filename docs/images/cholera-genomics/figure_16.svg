<rect x='67' y='1013' width='14' height='14' rx='3' fill='#009E73'/>
<text x='95' y='1028' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Same lineages, two prefixes: AFR10 was formerly T10 (Section 2.4)</text>
<rect x='67' y='1047' width='14' height='14' rx='3' fill='#009E73'/>
<text x='95' y='1062' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Each is a whole-genome SNP clade with its own geography and timing; T2 was Africa to Latin America</text>
<rect x='67' y='1081' width='14' height='14' rx='3' fill='#009E73'/>
<text x='95' y='1096' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>CholGEN: all 739 analysed genomes (of 763 passing QC) descend from known introductions (Mboowa 2026)</text>
<rect x='50' y='1138' width='740' height='269' rx='22' fill='#fff' stroke='#009E73' stroke-width='3' filter='url(#sh)'/>

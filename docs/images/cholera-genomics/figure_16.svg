<text x='95' y='1251' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>AFR10 in the DRC: at least 29 years</text>
<rect x='67' y='1270' width='14' height='14' rx='3' fill='#009E73'/>
<text x='95' y='1285' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>AFR12 in Nigeria, Cameroon: at least 15 years</text>
<rect x='810' y='1138' width='740' height='269' rx='22' fill='#fff' stroke='#009E73' stroke-width='3' filter='url(#sh)'/>
<path d='M831,1211 H891 M831,1211 V1161' stroke='#4D4D4D' stroke-width='4' fill='none'/><path d='M837,1201 L853,1187 L865,1195 L887,1169' stroke='#0072B2' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='887' cy='1169' r='7' fill='#D55E00'/>
<text x='911' y='1179' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#007A5A'>East and Southern: more diverse</text>
<rect x='827' y='1236' width='14' height='14' rx='3' fill='#009E73'/>
<text x='855' y='1251' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>AFR10, AFR11, AFR13, AFR15; often two or more</text>
<text x='855' y='1282' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>lineages per country in five years</text>
<rect x='827' y='1301' width='14' height='14' rx='3' fill='#009E73'/>
<text x='855' y='1316' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>AFR15: Malawi 2022–2023, 11–16 SNPs from</text>
<text x='855' y='1347' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Pakistani and Iraqi genomes</text>
<rect x='827' y='1366' width='14' height='14' rx='3' fill='#009E73'/>
<text x='855' y='1381' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Zambia 2023: AFR10 and AFR15 together</text>
<rect x='50' y='1423' width='1500' height='101' rx='22' fill='#FDF3DC' stroke='#E69F00' stroke-width='3' filter='url(#sh)'/>
<rect x='67' y='1449' width='14' height='14' rx='3' fill='#D55E00'/>
<text x='95' y='1464' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Tendencies, not boundaries: AFR10 spans both regions, so treat distributions as overlapping</text>
<rect x='67' y='1483' width='14' height='14' rx='3' fill='#009E73'/>
<text x='95' y='1498' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Use: separate outbreaks, rule out cross-border spread, frame clinical and AMR findings</text>
<rect x='50' y='1540' width='740' height='207' rx='22' fill='#EAF4FB' stroke='#0072B2' stroke-width='3' filter='url(#sh)'/>

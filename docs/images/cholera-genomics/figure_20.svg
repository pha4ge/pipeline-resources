<text x='151' y='279' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#005A8C'>Phylogenetic inference</text>
<text x='151' y='315' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>principal method</text>
<rect x='67' y='336' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='351' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>SNP-based tree: finest resolution</text>
<rect x='67' y='370' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='385' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Too heavy for large databases</text>
<rect x='67' y='404' width='14' height='14' rx='3' fill='#0072B2'/>
<text x='95' y='419' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Needs expertise to interpret</text>
<rect x='556' y='238' width='486' height='269' rx='22' fill='#E6F5EF' stroke='#009E73' stroke-width='3' filter='url(#sh)'/>
<rect x='587' y='260' width='40' height='54' rx='6' fill='#fff' stroke='#0072B2' stroke-width='5'/><path d='M596,274 h22' stroke='#0072B2' stroke-width='5' stroke-linecap='round'/><path d='M596,287 h22' stroke='#0072B2' stroke-width='5' stroke-linecap='round'/><path d='M596,300 h22' stroke='#0072B2' stroke-width='5' stroke-linecap='round'/>

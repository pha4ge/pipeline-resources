<circle cx='85' cy='693.0' r='34' fill='#0072B2'/>
<text x='85' y='703.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='29' font-weight='700' fill='#FFFFFF'>A</text>
<circle cx='265' cy='693.0' r='34' fill='#0072B2'/>
<text x='265' y='703.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='29' font-weight='700' fill='#FFFFFF'>B</text>

<text x='175.0' y='729.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>alleles</text>
<text x='355.0' y='671.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#005A8C'>20</text>
<text x='355.0' y='729.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>alleles</text>
<text x='532.5' y='671.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#B34700'>61</text>
<text x='532.5' y='729.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#4D4D4D'>alleles</text>
<path d='M85,641.0 H445 A52,52 0 0 1 445,745.0 H85 A52,52 0 0 1 85,641.0 Z' fill='none' stroke='#0072B2' stroke-width='3' stroke-dasharray='12 8'/>
<text x='265.0' y='629.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#005A8C'>cluster</text>
<text x='22' y='824' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>A, B and C form one cluster: each is within 25 allele</text>
<text x='22' y='858' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>differences of at least one other member (A and C may</text>
<text x='22' y='892' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>differ by more than 25). D is more than 25 allele</text>
<text x='22' y='926' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>differences from every member, so it is not linked.</text>
<text x='22' y='960' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Distances are hypothetical.</text>
<rect x='750' y='478' width='730' height='250' rx='22' fill='#FFFFFF' stroke='#CC79A7' stroke-width='3'/>
<rect x='750' y='478' width='730' height='52' rx='22' fill='#CC79A7'/>
<text x='1115.0' y='515' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='29' font-weight='700' fill='#FFFFFF'>Within-cluster phylogeny: SNPs</text>
<path d='M790,629.0 h40 M830,595.0 v68 M830,595.0 h110 M830,663.0 h40 M870,639.0 v48 M870,639.0 h70 M870,687.0 h70' stroke='#9A4573' stroke-width='5' fill='none'/>
<circle cx='960' cy='595.0' r='20' fill='#CC79A7'/>
<text x='960' y='605.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#FFFFFF'>A</text>
<circle cx='960' cy='639.0' r='20' fill='#CC79A7'/>
<text x='960' y='649.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#FFFFFF'>B</text>
<circle cx='960' cy='687.0' r='20' fill='#CC79A7'/>
<text x='960' y='697.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#FFFFFF'>C</text>
<text x='1020' y='605.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>SNP tree built only from the</text>
<text x='1020' y='639.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>members of the cluster; SNP</text>
<text x='1020' y='673.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>distances are shown in the SNP</text>
<text x='1020' y='707.0' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>Tree Viewer</text>
<rect x='750' y='748' width='730' height='238' rx='22' fill='#FFF6E3' stroke='#E69F00' stroke-width='3'/>
<text x='772' y='786' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='700' fill='#A66A00'>Common misconception</text>
<text x='772' y='820' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'><tspan font-style='italic'>V. cholerae</tspan> clusters are not defined by a SNP threshold.</text>
<text x='772' y='854' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>The 50-SNP single-linkage method belongs to NCBI's</text>
<text x='772' y='888' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>other, k-mer-based clustering pipeline, which is being</text>
<text x='772' y='922' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>replaced by wgMLST and remains in use for organism</text>
<text x='772' y='956' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='27' font-weight='400' fill='#1A1A1A'>groups with fewer than 1,000 isolates.</text>
</g>

